name: Deploy frontend

# Every push to main (or a manual run) rebuilds asiapharmsg.com on the EC2
# host. Credentials come from GitHub's OIDC token exchanged for the
# asiapharm-github-deploy role (defined in the backend repo under
# deploy/github-oidc-role.yml); nothing is stored in repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::495278513840:role/asiapharm-github-deploy
          aws-region: ap-southeast-1

      - name: Package release archive
        run: git archive --format=tar.gz -o /tmp/fe.tar.gz HEAD

      - name: Upload to S3
        run: aws s3 cp /tmp/fe.tar.gz s3://asiapharmsg-db-backups/config/fe.tar.gz

      - name: Deploy on EC2 via SSM
        run: bash deploy/run-remote.sh frontend
