services:
  frontend:
    build:
      context: .
      # Build-time values: Next.js bakes these into the bundle. Put them in a
      # `.env` file next to this compose file; compose substitutes them here.
      args:
        PUBLIC_URL: ${PUBLIC_URL:-}
        API_URL: ${API_URL:?set API_URL in .env, e.g. https://api.asiapharmsg.com}
        CAPTCHA_KEY: ${CAPTCHA_KEY:?set CAPTCHA_KEY (reCAPTCHA v2 site key) in .env}
        EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
        EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
        EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
    image: ap-frontend:latest
    restart: unless-stopped
    environment:
      PORT: 3000
    # Bound to localhost only; the host's Caddy reverse-proxies
    # asiapharmsg.com to 127.0.0.1:3000 (see Caddyfile.snippet).
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
